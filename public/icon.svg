<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Keep this comment inside the root element. libvips sniffs for `<svg` within
    roughly the first kilobyte, so a long preamble above the tag makes sharp
    reject the file with "Input file contains unsupported image format" even
    though the XML is perfectly valid - the error names neither the length nor
    the offset.

    Transparent background on purpose: a web clip cannot declare icon layers, so
    iOS 26 derives them from alpha - opaque pixels become the foreground, and the
    system generates its own backdrop and Liquid Glass lighting. An opaque image
    reads as a finished flat icon and gets no treatment at all. Outputs that need
    an opaque backdrop get it from scripts/generate-icons.mjs.

    What decides the treatment is how much transparency the mark walls off:
    the boundary between the mark and its enclosed cavities has to stay short.
    This outline scores 2.63 canvas widths against the 2.71 still observed to
    work, so enlarging it or subdividing its interior would both cost the effect.
    Filling the pocket would score 0 and be the safest shape of all - it stays
    open for the drawing, not for the treatment.
    See docs/app-icon-ios-liquid-glass.md.

    stroke-width 24 of a 512 canvas is the weight that survives the iOS
    treatment: the glass pass extrudes the stroke and adds a highlight along it,
    so anything heavier reads as a fat blob on the home screen.
  -->

  <!-- Pocket: straight opening, rounded bottom. Slightly taller than wide (236x248),
       because a bottom arc as wide as the opening reads as a bowl instead. -->
  <path d="M138 154A22 22 0 0 1 160 132H352A22 22 0 0 1 374 154V262A118 118 0 0 1 138 262Z"
        stroke="#22D3EE" stroke-width="24" stroke-linejoin="round"/>

  <!-- Stitching below the opening. Heavier than a real seam would be, so it
       survives the downscale to favicon sizes instead of turning into noise. -->
  <path d="M150 190H362" stroke="#1FA8BE" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="14 20"/>

  <!-- Coin: solid mass so the mark still reads at 16x16 -->
  <circle cx="256" cy="258" r="46" fill="#22D3EE"/>

  <!-- AI sparkles. Kept clear of the pocket's outer edge and of the tile corners,
       which the iOS squircle mask crops. -->
  <path d="M389 89L400 60L411 89L440 100L411 111L400 140L389 111L360 100Z" fill="#22D3EE"/>
  <path d="M101 331L110 312L119 331L138 340L119 349L110 368L101 349L82 340Z" fill="#0891B2"/>
</svg>
